<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font-family: Segoe UI, sans-serif; padding: 15px; margin: 0; }
    input, textarea, button { width: 100%; box-sizing: border-box; margin-bottom: 10px; padding: 8px; }
    button { background: #0078d4; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #005a9e; }
    textarea { height: 90px; resize: vertical; }
  </style>
</head>
<body>
  <h4>Asistente IA</h4>
  <input type="password" id="apiKey" placeholder="Pega tu API Key de Gemini" />
  <textarea id="prompt" placeholder="Escribe tu instrucción o pregunta..."></textarea>
  <button id="btnAsk">Preguntar / Generar</button>
  <button id="btnRewrite">Reescribir selección en Word</button>
  <div id="status" style="font-size: 13px; color: #555;"></div>

  <script>
    Office.onReady();

    const getStoredKey = () => {
      const key = document.getElementById("apiKey").value.trim() || localStorage.getItem("gemini_key");
      if (key) localStorage.setItem("gemini_key", key);
      return key;
    };
    document.getElementById("apiKey").value = localStorage.getItem("gemini_key") || "";

    async function callGemini(text) {
      const key = getStoredKey();
      if (!key) return alert("Por favor ingresa tu API Key");
      document.getElementById("status").innerText = "Procesando...";
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${key}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text }] }] })
          });
        const data = await res.json();
        document.getElementById("status").innerText = "";
        return data.candidates[0].content.parts[0].text;
      } catch (err) {
        document.getElementById("status").innerText = "Error al consultar la API";
      }
    }

    document.getElementById("btnAsk").onclick = async () => {
      const prompt = document.getElementById("prompt").value;
      const resp = await callGemini(prompt);
      if (resp) {
        Office.context.document.setSelectedDataAsync(resp, { coercionType: Office.CoercionType.Text });
      }
    };

    document.getElementById("btnRewrite").onclick = () => {
      Office.context.document.getSelectedDataAsync(Office.CoercionType.Text, async (result) => {
        if (result.status === Office.AsyncResultStatus.Succeeded && result.value) {
          const resp = await callGemini("Mejora la redacción, claridad y estilo del siguiente texto manteniendo el sentido:\n" + result.value);
          if (resp) {
            Office.context.document.setSelectedDataAsync(resp, { coercionType: Office.CoercionType.Text });
          }
        } else {
          alert("Selecciona texto en el documento primero.");
        }
      });
    };
  </script>
</body>
</html>
